# Evolution API v2 — WhatsApp para o validador de hangares.
#
# A API escuta SOMENTE em 127.0.0.1: o n8n roda nesta mesma máquina e fala com
# ela por localhost, então nada precisa ser aberto no security group. Manter
# assim — o webhook do n8n não tem autenticação (ver docs/perguntas-abertas.md).
services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [postgres, redis]
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR
    networks: [evolution-net]

  postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    # max_connections baixo de propósito: o padrão do compose oficial é 1000,
    # que reserva memória compartilhada demais para uma máquina de 2 GB.
    command: postgres -c max_connections=50
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [evolution-net]

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis:/data
    networks: [evolution-net]

volumes:
  evolution_instances:
  postgres_data:
  evolution_redis:

networks:
  evolution-net:
    driver: bridge
