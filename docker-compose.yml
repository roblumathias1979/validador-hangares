services:
  n8n:
    # Fixado em 1.123.77 (não ":latest") — a série 2.x tem um bug real de
    # ativação de webhook, descoberto testando este projeto (ver README).
    image: docker.n8n.io/n8nio/n8n:1.123.77
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      # Nó "Execute Command" vem desabilitado por padrão no n8n 2.x (motivos
      # de segurança). É o nó que este projeto usa pra chamar os scripts
      # Playwright — sem isso, o workflow dá erro "Unrecognized node type".
      - NODES_EXCLUDE=[]
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./scripts:/scripts
      - ./config:/config
    env_file:
      - .env
