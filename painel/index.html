<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Validador</title>
<style>
  :root {
    --fundo: #f6f7f9; --cartao: #fff; --borda: #d8dce3; --texto: #1a1d21;
    --fraco: #667085; --ok: #067647; --alerta: #b54708; --erro: #b42318;
    --acento: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#15171a; --cartao:#1e2125; --borda:#333940; --texto:#e8eaed;
            --fraco:#9aa3af; --ok:#4ade80; --alerta:#fbbf24; --erro:#f87171; --acento:#58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 20px; border-bottom:1px solid var(--borda); background:var(--cartao); }
  h1 { margin:0 0 6px; font-size:17px; }
  .resumo { color:var(--fraco); font-size:13px; }
  .resumo b { color:var(--texto); }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .aviso { padding:10px 12px; border-radius:6px; margin-bottom:14px; font-size:13px;
           border:1px solid var(--borda); background:var(--cartao); }
  .aviso.pendente { border-color:var(--alerta); }
  .aviso.ruim { border-color:var(--erro); color:var(--erro); }
  .aviso.ok { border-color:var(--ok); }
  .hangar { background:var(--cartao); border:1px solid var(--borda); border-radius:8px;
            margin-bottom:10px; overflow:hidden; }
  .cab { display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; }
  .cab:hover { background:rgba(127,127,127,.06); }
  .nome { font-weight:600; flex:1; }
  .etq { font-size:11px; padding:2px 7px; border-radius:99px; border:1px solid var(--borda);
         color:var(--fraco); white-space:nowrap; }
  .etq.on { color:var(--ok); border-color:var(--ok); }
  .etq.off { color:var(--fraco); }
  .etq.aviso { color:var(--alerta); border-color:var(--alerta); }
  .corpo { display:none; padding:4px 14px 14px; border-top:1px solid var(--borda); }
  .corpo.aberto { display:block; }
  .campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px; margin:12px 0; }
  label { display:block; font-size:12px; color:var(--fraco); margin-bottom:3px; }
  input[type=text], input[type=number] {
    width:100%; padding:7px 9px; border:1px solid var(--borda); border-radius:5px;
    background:var(--fundo); color:var(--texto); font:inherit; font-size:13px; }
  .dica { font-size:11px; color:var(--fraco); margin-top:3px; }
  .linha-check { display:flex; align-items:center; gap:7px; font-size:13px; }
  button { padding:7px 14px; border-radius:5px; border:1px solid var(--acento);
           background:var(--acento); color:#fff; font:inherit; font-size:13px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.sec { background:transparent; color:var(--acento); }
  .msg { margin-top:9px; font-size:13px; }
  .msg.ok { color:var(--ok); } .msg.erro { color:var(--erro); }
  .somente-leitura { font-size:12px; color:var(--fraco); border-top:1px solid var(--borda);
                     padding-top:9px; margin-top:4px; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .secao { background:var(--cartao); border:1px solid var(--borda); border-radius:8px;
           margin-top:18px; padding:14px; }
  .secao h2 { margin:0 0 4px; font-size:15px; }
  .secao .sub { color:var(--fraco); font-size:12px; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--fraco); font-size:11px;
       text-transform:uppercase; letter-spacing:.03em; padding:6px 8px;
       border-bottom:1px solid var(--borda); }
  td { padding:7px 8px; border-bottom:1px solid var(--borda); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  .st { font-size:11px; padding:2px 7px; border-radius:99px; white-space:nowrap;
        border:1px solid var(--borda); color:var(--fraco); }
  .st.bom { color:var(--ok); border-color:var(--ok); }
  .st.ruim { color:var(--erro); border-color:var(--erro); }
  .st.meio { color:var(--alerta); border-color:var(--alerta); }
  .vazio { color:var(--fraco); font-size:13px; padding:8px; }
  .filtros { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .refs { border:1px solid var(--borda); border-radius:6px; padding:12px; margin-top:10px; }
  .refs h3 { margin:0 0 3px; font-size:13px; }
  .refs .sub { font-size:12px; color:var(--fraco); margin-bottom:10px; }
  .miniaturas { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .mini { border:1px solid var(--borda); border-radius:6px; padding:6px; width:132px; font-size:11px; }
  .mini img { width:100%; height:88px; object-fit:cover; border-radius:4px; display:block; }
  .mini .arq { color:var(--fraco); word-break:break-all; margin:4px 0; }
  .video-aviso { background:rgba(180,120,8,.12); border-radius:4px; padding:4px 6px; margin:4px 0; }
  select { padding:6px 8px; border:1px solid var(--borda); border-radius:5px;
           background:var(--fundo); color:var(--texto); font:inherit; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Painel do Validador — hangares SBJD</h1>
  <div class="resumo" id="resumo">carregando…</div>
</header>

<main>
  <div id="avisos"></div>
  <div id="lista"></div>

  <div class="secao">
    <h2>Tickets processados</h2>
    <div class="sub" id="sub-hist">carregando…</div>
    <div class="filtros">
      <select id="f-hangar" onchange="carregarHistorico()"><option value="">todos os hangares</option></select>
      <select id="f-tipo" onchange="carregarHistorico()">
        <option value="">tudo</option>
        <option value="true">só validados</option>
      </select>
      <button class="sec" onclick="carregarHistorico()">atualizar</button>
    </div>
    <div id="historico"></div>
  </div>

  <div class="secao" id="sec-usuarios">
    <h2>Quem pode acessar</h2>
    <div id="aviso-smtp"></div>
    <div class="sub" id="sub-usuarios">carregando…</div>
    <div id="lista-usuarios"></div>
    <div class="campos" style="margin-top:12px">
      <div><label for="u-nome">novo usuário</label>
        <input id="u-nome" type="text" placeholder="ex: maria.silva">
        <div class="dica">3 a 32 caracteres: letras, números, ponto, hífen, sublinhado.</div></div>
      <div><label for="u-email">e-mail</label>
        <input id="u-email" type="email" placeholder="para recuperar a senha">
        <div class="dica">Opcional — serve só como contato.</div></div>
      <div><label for="u-senha">senha</label>
        <input id="u-senha" type="password" autocomplete="new-password">
        <div class="dica" id="dica-senha">mínimo de caracteres carregando…</div></div>
    </div>
    <div class="linha-check" style="margin-bottom:10px">
      <input type="checkbox" id="u-leitura">
      <label for="u-leitura" style="margin:0">Somente leitura (vê tudo, não altera configuração)</label>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="criarUsuario(this)">Criar usuário</button>
      <span class="msg" id="msg-usuarios"></span>
    </div>
  </div>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
let estado = null;

// Campos editáveis e suas regras — repetidas aqui só para orientar quem
// preenche. Quem valida de verdade é o servidor; esta tela não é a barreira.
const DICAS = {
  cotaMensalForaPrazo: 'Validações fora do prazo gratuitas por mês. Inteiro, 0 a 100.',
  diasValidacaoPadrao: 'Tolerância concedida ao validar. Máximo 20 — é o teto do slider do ValidPark.',
  prazoValidacaoHoras: 'Janela para validar após a emissão. Vazio = sem limite.',
  placaGenerica: 'Usada quando o cliente não informa a placa na legenda. Formato AAA1234 ou AAA1A23.',
  grupoWhatsappId: 'Grupo de onde chegam os tickets. Sem ele o hangar não recebe nada.',
  grupoAdministracao: 'Quem recebe os avisos de erro. Grupo (@g.us) ou pessoa (@s.whatsapp.net).',
};

function etiqueta(texto, classe) { return `<span class="etq ${classe||''}">${texto}</span>`; }

function desenhar() {
  const r = estado.resumo;
  $('#resumo').innerHTML =
    `<b>${r.ativos}</b> de <b>${r.total}</b> hangares recebendo mensagens · ` +
    `<b>${r.semCredencial}</b> sem credencial · <b>${r.semAdmin}</b> ativos sem destino de aviso`;

  const avisos = [];

  const s = estado.saude;
  if (!s) {
    avisos.push(`<div class="aviso pendente"><b>Monitor de saúde sem leitura.</b>
      Nenhuma verificação foi gravada ainda — o serviço pode não estar rodando.</div>`);
  } else {
    const idadeMin = Math.round((Date.now() - new Date(s.em).getTime()) / 60000);
    // Leitura velha é tão preocupante quanto leitura ruim: significa que o
    // próprio monitor parou, e aí ninguém está vigiando nada.
    const velha = idadeMin > 15;
    if (!s.saudavel) {
      avisos.push(`<div class="aviso ruim"><b>🔴 Sistema com problema</b><br>
        ${s.problemas.map(p => '• ' + p).join('<br>')}
        <div style="margin-top:6px;opacity:.75">verificado há ${idadeMin} min</div></div>`);
    } else if (velha) {
      avisos.push(`<div class="aviso pendente"><b>Monitor parado.</b>
        A última verificação foi há ${idadeMin} minutos — deveria ser a cada 5.
        O sistema pode estar bem, mas ninguém está vigiando.</div>`);
    } else {
      avisos.push(`<div class="aviso ok"><b>🟢 Tudo respondendo</b> —
        ${Object.entries(s.checagens).map(([k,c]) => `${k}: ${c.detalhe}`).join(' · ')}
        <span style="opacity:.75">(há ${idadeMin} min)</span></div>`);
    }
  }

  if (estado.commitsPendentes > 0) {
    avisos.push(`<div class="aviso pendente"><b>${estado.commitsPendentes} alteração(ões) ainda não enviadas ao GitHub.</b>
      O servidor não tem credencial de escrita, então as mudanças ficam commitadas só aqui.
      Elas valem em produção normalmente — o que falta é o envio para o repositório remoto.</div>`);
  }
  $('#avisos').innerHTML = avisos.join('');

  $('#lista').innerHTML = estado.hangares.map(h => {
    const etqs = [
      h.ativo ? etiqueta('recebendo', 'on') : etiqueta('sem grupo', 'off'),
      h.temCredencial ? '' : etiqueta('sem credencial', 'aviso'),
      h.ativo && !h.grupoAdministracao ? etiqueta('sem aviso de erro', 'aviso') : '',
      h.exigeFotoVeiculoNoLocal ? etiqueta('exige foto do local') : '',
      etiqueta(`cota ${h.cotaUsada}/${h.cotaMensalForaPrazo ?? '?'}`),
      h.historico.validados ? etiqueta(`${h.historico.validados} validado(s)`, 'on') : '',
    ].filter(Boolean).join(' ');

    const campo = (n, tipo, valor) => `
      <div>
        <label for="${h.id}-${n}">${n}</label>
        <input id="${h.id}-${n}" type="${tipo}" value="${valor ?? ''}" data-campo="${n}">
        <div class="dica">${DICAS[n] || ''}</div>
      </div>`;

    return `
    <div class="hangar" data-id="${h.id}">
      <div class="cab" onclick="this.nextElementSibling.classList.toggle('aberto')">
        <span class="nome">${h.nome}</span> ${etqs}
      </div>
      <div class="corpo">
        <div class="campos">
          ${campo('cotaMensalForaPrazo','number',h.cotaMensalForaPrazo)}
          ${campo('diasValidacaoPadrao','number',h.diasValidacaoPadrao)}
          ${campo('prazoValidacaoHoras','number',h.prazoValidacaoHoras)}
          ${campo('placaGenerica','text',h.placaGenerica)}
          ${campo('grupoWhatsappId','text',h.grupoWhatsappId)}
          ${campo('grupoAdministracao','text',h.grupoAdministracao)}
        </div>
        <div class="linha-check">
          <input type="checkbox" id="${h.id}-foto" data-campo="exigeFotoVeiculoNoLocal" ${h.exigeFotoVeiculoNoLocal?'checked':''}
                 onchange="alternarReferencias('${h.id}', this.checked)">
          <label for="${h.id}-foto" style="margin:0">Exige foto do veículo no local (antifraude)</label>
        </div>
        <div id="ref-${h.id}" class="refs" style="display:${h.exigeFotoVeiculoNoLocal?'block':'none'}"></div>
        <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
          <button onclick="salvar('${h.id}', this)">Salvar</button>
          <span class="msg" id="msg-${h.id}"></span>
        </div>
        <div class="somente-leitura">
          Não editável aqui: credenciais (ficam no <code>.env</code>), seletores da página
          (são código, quebram o hangar em silêncio se errados) e dados do Asaas
          (erro emite cobrança para o CNPJ errado).
          ${h.temAsaas ? 'Cliente Asaas cadastrado.' : 'Sem cliente Asaas — faturamento vai pedir cadastro à administração.'}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function carregar() {
  const r = await fetch('/api/estado');
  estado = await r.json();
  desenhar();
}

async function salvar(id, botao) {
  const raiz = document.querySelector(`.hangar[data-id="${id}"]`);
  const msg = $(`#msg-${id}`);
  const corpo = {};
  raiz.querySelectorAll('[data-campo]').forEach(el => {
    corpo[el.dataset.campo] = el.type === 'checkbox' ? el.checked : el.value;
  });

  botao.disabled = true; msg.className = 'msg'; msg.textContent = 'salvando…';
  try {
    const r = await fetch('/api/hangar/' + encodeURIComponent(id), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(corpo),
    });
    const d = await r.json();
    if (!r.ok) { msg.className = 'msg erro'; msg.textContent = d.erro || 'erro'; }
    else if (d.semMudanca) { msg.className = 'msg'; msg.textContent = 'nada mudou'; }
    else {
      msg.className = 'msg ok';
      msg.textContent = `salvo e commitado (${d.commit}) — ${d.aplicadas.length} campo(s)`;
      await carregar();
      // redesenhar fecha os painéis; reabre o que estava sendo editado
      document.querySelector(`.hangar[data-id="${id}"] .corpo`).classList.add('aberto');
    }
  } catch (e) {
    msg.className = 'msg erro'; msg.textContent = 'falha de rede: ' + e.message;
  } finally { botao.disabled = false; }
}

// Cores por situação: verde só para o que de fato validou, vermelho para o que
// exigiu gente, amarelo para o que ficou esperando resposta do cliente.
const BONS = ['validado'];
const RUINS = ['erro_validacao','sem_vagas','prazo_excedido_no_site','indeterminado','erro','valor_invalido','local_incompativel'];

function classeStatus(s) {
  if (BONS.includes(s)) return 'bom';
  if (RUINS.includes(s)) return 'ruim';
  if (s.startsWith('fora_do_prazo') || s.startsWith('ocr_') || s === 'resposta_nao_entendida') return 'meio';
  return '';
}

function quando(iso) {
  return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

async function carregarHistorico() {
  const q = new URLSearchParams({ limite: '100' });
  if ($('#f-hangar').value) q.set('hangar', $('#f-hangar').value);
  if ($('#f-tipo').value) q.set('apenasValidados', $('#f-tipo').value);

  const d = await (await fetch('/api/validacoes?' + q)).json();
  $('#sub-hist').textContent =
    `${d.eventos.length} evento(s) · histórico mantido por ${d.retencaoDias} dias · mensagens ignoradas não entram aqui`;

  if (!d.eventos.length) {
    $('#historico').innerHTML = '<div class="vazio">Nada registrado ainda. O histórico começa a partir de agora — validações anteriores não foram gravadas, porque o registro não existia.</div>';
    return;
  }

  $('#historico').innerHTML = `<table>
    <thead><tr><th>quando</th><th>hangar</th><th>ticket</th><th>placa</th><th>situação</th><th>quem enviou</th></tr></thead>
    <tbody>${d.eventos.map(e => `<tr>
      <td>${quando(e.em)}</td>
      <td>${e.hangarId || '—'}</td>
      <td><code>${e.ticket || '—'}</code></td>
      <td>${e.placa || '—'}${e.placaEhGenerica ? ' <span class="st">genérica</span>' : ''}</td>
      <td><span class="st ${classeStatus(e.status)}">${e.status}</span>${e.usouCota ? ' <span class="st meio">usou cota</span>' : ''}${e.escalado ? ' <span class="st ruim">escalado</span>' : ''}${
        e.local ? ` <span class="st ${e.local==='compativel'?'bom':e.local==='incompativel'?'ruim':'meio'}" title="${(e.localMotivo||'').replace(/"/g,'')}">local: ${e.local}</span>` : ''}</td>
      <td>${e.remetente || '—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function alternarReferencias(id, ligado) {
  const caixa = $(`#ref-${id}`);
  caixa.style.display = ligado ? 'block' : 'none';
  if (ligado) await carregarReferencias(id);
}

async function carregarReferencias(id) {
  const caixa = $(`#ref-${id}`);
  const d = await (await fetch('/api/referencias/' + encodeURIComponent(id))).json();
  const imagens = d.arquivos.filter(a => a.usadoNaConferencia);

  caixa.innerHTML = `
    <h3>Fotos de referência do pátio</h3>
    <div class="sub">
      O bot compara a foto do cliente com estas. Até ${d.max} imagens — cada uma entra em
      toda chamada ao modelo, então mais não significa melhor: prefira ângulos diferentes
      do mesmo lugar. ${imagens.length ? `Hoje: ${imagens.length} de ${d.max}.` : 'Nenhuma ainda — a conferência usa só a descrição em texto.'}
    </div>
    <div class="miniaturas">
      ${d.arquivos.map(a => `<div class="mini">
        ${a.usadoNaConferencia
          ? `<img src="/api/referencias/${encodeURIComponent(id)}/${encodeURIComponent(a.nome)}" alt="referência">`
          : `<div class="video-aviso">vídeo — <b>não</b> entra na conferência automática, serve só para consulta</div>`}
        <div class="arq">${a.nome}</div>
        <button class="sec" onclick="apagarReferencia('${id}','${a.nome}')">apagar</button>
      </div>`).join('') || '<div class="sub">nenhum arquivo</div>'}
    </div>
    <input type="file" id="arq-${id}" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime"
           onchange="enviarReferencia('${id}', this)">
    <span class="msg" id="msgref-${id}"></span>`;
}

async function enviarReferencia(id, input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  const msg = $(`#msgref-${id}`);
  msg.className = 'msg'; msg.textContent = 'enviando…';
  const base64 = await new Promise((ok, falha) => {
    const leitor = new FileReader();
    leitor.onload = () => ok(String(leitor.result).split(',')[1]);
    leitor.onerror = falha;
    leitor.readAsDataURL(arquivo);
  });
  const r = await fetch('/api/referencias/' + encodeURIComponent(id), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ mimetype: arquivo.type, base64, rotulo: arquivo.name.replace(/\.[^.]+$/, '') }),
  });
  const d = await r.json();
  input.value = '';
  if (!r.ok) { msg.className = 'msg erro'; msg.textContent = d.erro || 'erro'; return; }
  msg.className = 'msg ok';
  msg.textContent = d.usadoNaConferencia ? 'foto adicionada à conferência' : 'vídeo guardado (não entra na conferência)';
  await carregarReferencias(id);
}

async function apagarReferencia(id, nome) {
  if (!confirm(`Apagar "${nome}"?`)) return;
  await fetch('/api/referencias/' + encodeURIComponent(id), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ acao: 'apagar', nome }),
  });
  await carregarReferencias(id);
}

async function carregarUsuarios() {
  const d = await (await fetch('/api/usuarios')).json();
  $('#dica-senha').textContent = `Mínimo de ${d.minSenha} caracteres.`;
  // Não existe "esqueci minha senha": o SMTP da Locaweb recusa autenticação a
  // partir deste servidor (ver painel/README.md). Quem perde a senha depende
  // de outra conta de administrador — por isso o aviso fica sempre visível
  // quando há uma só.
  $('#aviso-smtp').innerHTML = d.usuarios.length < 2
    ? `<div class="aviso pendente" style="margin-bottom:12px"><b>Só existe uma conta de administrador.</b>
       Não há recuperação de senha por e-mail: se esta senha se perder, o acesso ao painel
       só volta editando arquivo no servidor por SSH. Crie uma segunda conta.</div>`
    : '';
  $('#sub-usuarios').textContent = d.usuarios.length
    ? `${d.usuarios.length} conta(s) · você está como "${d.eu}" · 5 tentativas erradas bloqueiam por 15 minutos · sem recuperação por e-mail`
    : 'Nenhuma conta criada ainda — o acesso está pela senha de resgate do .env. Crie a primeira conta: a senha única deixa de funcionar assim que existir uma.';

  $('#lista-usuarios').innerHTML = d.usuarios.length ? `<table>
    <thead><tr><th>usuário</th><th>e-mail</th><th>perfil</th><th>último acesso</th><th></th></tr></thead>
    <tbody>${d.usuarios.map(u => `<tr>
      <td><b>${u.nome}</b>${u.nome === d.eu ? ' <span class="st">você</span>' : ''}</td>
      <td>${u.email || '<span class="st">—</span>'}</td>
      <td>${u.somenteLeitura ? '<span class="st">somente leitura</span>' : '<span class="st bom">pode alterar</span>'}</td>
      <td>${u.ultimoAcesso ? quando(u.ultimoAcesso) : 'nunca'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="sec" onclick="definirEmail('${u.nome}','${u.email || ''}')">e-mail</button>
        <button class="sec" onclick="trocarSenha('${u.nome}')">trocar senha</button>
        ${u.nome === d.eu ? '' : `<button class="sec" onclick="removerUsuario('${u.nome}')">remover</button>`}
      </td></tr>`).join('')}</tbody></table>` : '';
}

async function acaoUsuario(corpo, msgEl) {
  msgEl.className = 'msg'; msgEl.textContent = 'enviando…';
  const r = await fetch('/api/usuarios', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(corpo),
  });
  const d = await r.json();
  if (!r.ok) { msgEl.className = 'msg erro'; msgEl.textContent = d.erro || 'erro'; return false; }
  msgEl.className = 'msg ok'; msgEl.textContent = 'feito';
  await carregarUsuarios();
  return true;
}

async function criarUsuario(botao) {
  botao.disabled = true;
  const ok = await acaoUsuario({
    nome: $('#u-nome').value, senha: $('#u-senha').value,
    email: $('#u-email').value, somenteLeitura: $('#u-leitura').checked,
  }, $('#msg-usuarios'));
  if (ok) { $('#u-nome').value = ''; $('#u-senha').value = ''; $('#u-email').value = ''; $('#u-leitura').checked = false; }
  botao.disabled = false;
}

async function definirEmail(nome, atual) {
  const email = prompt(`E-mail de "${nome}" (para recuperação de senha):`, atual);
  if (email === null) return;
  await acaoUsuario({ acao: 'definirEmail', nome, email }, $('#msg-usuarios'));
}

async function trocarSenha(nome) {
  const senha = prompt(`Nova senha para "${nome}":`);
  if (!senha) return;
  await acaoUsuario({ acao: 'trocarSenha', nome, senha }, $('#msg-usuarios'));
}

async function removerUsuario(nome) {
  if (!confirm(`Remover o acesso de "${nome}"?`)) return;
  await acaoUsuario({ acao: 'remover', nome }, $('#msg-usuarios'));
}

carregar().then(() => {
  $('#f-hangar').innerHTML = '<option value="">todos os hangares</option>' +
    estado.hangares.filter(h => h.ativo).map(h => `<option value="${h.id}">${h.nome}</option>`).join('');
  carregarHistorico();
  carregarUsuarios();
  // Conta somente leitura não deve ver botões que vão falhar com 403.
  if (estado.usuario && estado.usuario.somenteLeitura) {
    document.querySelectorAll('button').forEach(b => {
      if (!b.classList.contains('sec')) b.style.display = 'none';
    });
    $('#sec-usuarios').style.display = 'none';
  }
});
</script>
